<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Profile | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body { 
            height: 100%; 
            background-color: var(--accent-bg); 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            overflow: hidden;
        }

        /* --- UPDATED NAVBAR & SIDEBAR (Matches Overview/Curriculum) --- */
        .navbar { 
            background: var(--sidebar-bg); 
            height: 100vh; 
            position: fixed; 
            width: 260px; 
            padding: 2rem 1.2rem; 
            z-index: 1050;
            align-items: flex-start;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 12px 15px; 
            border-radius: 12px; 
            margin-bottom: 5px; 
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
        }

        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }

        /* --- MAIN CONTENT AREA --- */
        main { 
            margin-left: 260px; 
            height: 100vh;
            padding: 3rem 2.5rem; 
            overflow-y: auto;
            transition: 0.3s; 
        }

        /* --- PROFILE CARD ELEMENTS --- */
        .profile-card { background: var(--white); border-radius: 24px; padding: 2.5rem; box-shadow: var(--shadow); border: none; }
        .profile-img-container { position: relative; width: 140px; margin: 0 auto 1.5rem; }
        .profile-img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); padding: 3px; background: white; box-shadow: var(--shadow); }
        
        .upload-label { 
            position: absolute; bottom: 5px; right: 5px; 
            background: var(--primary); color: white; 
            width: 38px; height: 38px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border: 3px solid white; transition: 0.2s;
        }
        .upload-label:hover { transform: scale(1.1); background: #00569d; }
        #pfp-input { display: none; }

        .editable-field { transition: 0.3s; border: 2px solid transparent; }
        .editing .editable-field { background: #f1f7ff !important; border-color: var(--primary) !important; color: #000; }
        
        .stat-box { background: #f8faff; border-radius: 15px; padding: 1rem; text-align: center; border: 1px solid rgba(0,0,0,0.02); }

        /* --- MOBILE ADAPTATIONS --- */
        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { 
                width: 100%; height: auto; position: fixed; top: 0; padding: 0.7rem 1rem; flex-direction: row !important; 
            }
            main { margin-left: 0; margin-top: 60px; height: auto; padding: 1.5rem; overflow: visible; }
            .navbar-collapse { 
                background: var(--sidebar-bg); position: absolute; top: 55px; left: 0; width: 100%; padding: 1rem; border-radius: 0 0 20px 20px; 
            }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="fas fa-university me-2"></i> 
                    <span class="desktop-only">Registrar Portal</span>
                    <span class="d-lg-none">Portal</span>
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-th-large me-2"></i> Overview</a></li>
                    <li class="nav-item"><a class="nav-link" href="Enrollment.html"><i class="fas fa-user-plus me-2"></i> Enrollment</a></li>
                    <li class="nav-item"><a class="nav-link" href="Request.html"><i class="fas fa-file-alt me-2"></i> Requests</a></li>
                    <li class="nav-item"><a class="nav-link" href="Records.html"><i class="fas fa-clipboard-list me-2"></i> Records</a></li>
                    <li class="nav-item mt-lg-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()">
                            <i class="fas fa-power-off me-2"></i> Log out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="row g-4 justify-content-center">
            <div class="col-lg-4">
                <div class="profile-card text-center">
                    <div class="profile-img-container">
                        <img id="display-pfp" src="" class="profile-img" alt="Registrar">
                        <label for="pfp-input" class="upload-label">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="pfp-input" accept="image/*">
                    </div>
                    
                    <h4 id="display-name" class="fw-bold mb-1 text-dark">Registrar Officer</h4>
                    <span class="badge bg-light text-primary border px-3 py-2 rounded-pill mb-4">Senior Administrator</span>
                    
                    <div class="row g-2 mb-4">
                        <div class="col-6"><div class="stat-box"><h5 class="fw-bold mb-0">204</h5><small class="text-muted">Requests</small></div></div>
                        <div class="col-6"><div class="stat-box"><h5 class="fw-bold mb-0">1.2k</h5><small class="text-muted">Records</small></div></div>
                    </div>

                    <button id="edit-btn" class="btn btn-primary w-100 rounded-3 fw-bold py-2 shadow-sm" onclick="toggleEdit()">
                        <i class="fas fa-user-edit me-2"></i>Edit Profile
                    </button>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="profile-card" id="info-card">
                    <h5 class="fw-bold mb-4" style="color: var(--primary);">Administrative Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Full Name</label>
                            <input type="text" id="input-name" class="form-control editable-field bg-light border-0 py-2" value="" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Employee ID</label>
                            <input type="text" id="input-id" class="form-control bg-light border-0 py-2" value="" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Office Location</label>
                            <input type="text" id="input-office" class="form-control editable-field bg-light border-0 py-2" value="Main Administration Bldg" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Email Address</label>
                            <input type="email" id="input-email" class="form-control editable-field bg-light border-0 py-2" value="registrar@school.edu" disabled>
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold text-muted mb-1">Office Phone</label>
                            <input type="text" id="input-phone" class="form-control editable-field bg-light border-0 py-2" value="0912-345-6789" disabled>
                        </div>
                        <div class="col-12 mt-4">
                            <div class="p-3 rounded-3 bg-light border-start border-primary border-4">
                                <small class="text-muted d-block fw-bold">SYSTEM ACCESS LEVEL</small>
                                <span class="fw-bold text-dark">Full Administrative Access (Level 4)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            document.getElementById('display-name').innerText = user.name;
            document.getElementById('input-name').value = user.name;
            document.getElementById('input-id').value = user.portalId;

            const displayPfp = document.getElementById('display-pfp');
            if (user.profilePic) {
                displayPfp.src = user.profilePic;
            } else {
                const initials = user.name.split(' ').map(n => n[0]).join('+');
                displayPfp.src = `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);

        document.getElementById('pfp-input').onchange = function(evt) {
            const file = evt.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('display-pfp').src = base64Image;
                    let user = JSON.parse(localStorage.getItem('currentUser'));
                    user.profilePic = base64Image;
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    updateUserList(user);
                };
                reader.readAsDataURL(file);
            }
        };

        function updateUserList(updatedUser) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            const idx = users.findIndex(u => u.portalId === updatedUser.portalId);
            if (idx !== -1) {
                users[idx] = updatedUser;
                localStorage.setItem('users', JSON.stringify(users));
            }
        }

        let isEditing = false;
        function toggleEdit() {
            isEditing = !isEditing;
            const card = document.getElementById('info-card');
            const btn = document.getElementById('edit-btn');
            const inputs = document.querySelectorAll('.editable-field');

            if (isEditing) {
                card.classList.add('editing');
                btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Changes';
                btn.classList.replace('btn-primary', 'btn-success');
                inputs.forEach(i => i.disabled = false);
            } else {
                card.classList.remove('editing');
                btn.innerHTML = '<i class="fas fa-user-edit me-2"></i>Edit Profile';
                btn.classList.replace('btn-success', 'btn-primary');
                inputs.forEach(i => i.disabled = true);

                let user = JSON.parse(localStorage.getItem('currentUser'));
                user.name = document.getElementById('input-name').value;
                localStorage.setItem('currentUser', JSON.stringify(user));
                updateUserList(user);
                
                loadProfile();
                alert("Profile changes saved successfully!");
            }
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
