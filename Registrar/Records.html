<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar | Academic Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--accent-bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* --- UNIFIED SIDEBAR --- */
        .navbar { 
            background: var(--sidebar-bg); 
            height: 100vh; 
            position: fixed; 
            width: 260px; 
            padding: 2rem 1.2rem; 
            z-index: 1050;
            align-items: flex-start;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 12px 15px; 
            border-radius: 12px; 
            margin-bottom: 5px; 
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
        }

        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }

        .top-header {
            margin-left: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 2rem; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 60px; 
        }

        main { 
            margin-left: 260px; 
            height: calc(100vh - 60px); 
            padding: 2.5rem; 
            overflow-y: auto; 
        }

        .record-card { 
            background: var(--white); 
            border-radius: 20px; 
            padding: 1.5rem; 
            box-shadow: var(--shadow); 
            border: none; 
        }

        .nav-pills .nav-link { border-radius: 50px; padding: 8px 25px; font-weight: 600; color: var(--text-main); }
        .nav-pills .nav-link.active { background-color: var(--primary) !important; color: white !important; }

        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { width: 100%; height: auto; position: fixed; top: 0; padding: 0.7rem 1rem; flex-direction: row !important; }
            .top-header { margin-left: 0; margin-top: 55px; height: 50px; padding: 0 1rem; }
            main { margin-left: 0; height: auto; padding: 1.5rem; }
            .navbar-collapse { background: var(--sidebar-bg); position: absolute; top: 55px; left: 0; width: 100%; padding: 1rem; border-radius: 0 0 20px 20px; }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="fas fa-university me-2"></i> 
                    <span class="desktop-only">Registrar Portal</span>
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-th-large me-2"></i> Overview</a></li>
                    <li class="nav-item"><a class="nav-link" href="Enrollment.html"><i class="fas fa-user-plus me-2"></i> Enrollment</a></li>
                    <li class="nav-item"><a class="nav-link" href="Request.html"><i class="fas fa-file-invoice me-2"></i> Requests</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Records.html"><i class="fas fa-clipboard-list me-2"></i> Records</a></li>
                    <li class="nav-item mt-lg-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()">
                            <i class="fas fa-power-off me-2"></i> Log out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="Profile.html" class="d-flex align-items-center gap-2 text-decoration-none">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName" style="font-size: 0.8rem;">Loading...</p>
                <small class="text-muted" id="headerID" style="font-size: 0.65rem;">ID: ---</small>
            </div>
            <img src="" id="headerAvatar" class="rounded-circle border border-primary p-1" width="35" height="35" style="object-fit: cover;">
        </a>
    </header>

    <main>
        <div class="d-md-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0" style="color: var(--primary);">Academic Records</h3>
                <p class="text-muted small">Centralized database for students and faculty.</p>
            </div>
            <ul class="nav nav-pills bg-white p-1 rounded-pill shadow-sm" id="pills-tab">
                <li class="nav-item"><button class="nav-link active" id="btnStudents" onclick="switchTable('students')">Students</button></li>
                <li class="nav-item"><button class="nav-link" id="btnTeachers" onclick="switchTable('teachers')">Teachers</button></li>
            </ul>
        </div>

        <div class="record-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead id="tableHead" class="table-light"></thead>
                    <tbody id="recordBody"></tbody>
                </table>
            </div>
        </div>

        <div class="modal fade" id="profileModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                    <div class="modal-header border-0 pb-0">
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4" id="profileContent"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DATA SOURCE ---
        const defaultStudents = [
            { name: "Juan Dela Cruz", lrn: "123456789012", strand: "ICT", grade: "12", gwa: "94.5" },
            { name: "Maria Santos", lrn: "987654321098", strand: "ABM", grade: "11", gwa: "92.0" }
        ];

        const teacherData = [
            { name: "Prof. Alberto Reyes", id: "TCH-2024-001", dept: "Tech-Voc", subjects: ["Programming", "MIL"], status: "Active" },
            { name: "Ms. Sofia Rivera", id: "TCH-2022-045", dept: "Gen-Ed", subjects: ["Oral Com", "Literature"], status: "Active" }
        ];

        let currentView = 'students';

        document.addEventListener('DOMContentLoaded', () => {
            syncProfile();
            renderTable();
        });

        function syncProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if(user) {
                document.getElementById('headerName').innerText = user.name;
                document.getElementById('headerID').innerText = `ID: ${user.portalId}`;
                const avatar = document.getElementById('headerAvatar');
                if(user.profilePic) avatar.src = user.profilePic;
                else avatar.src = `https://ui-avatars.com/api/?name=${user.name.replace(' ', '+')}&background=0067ba&color=fff`;
            }
        }

        function switchTable(view) {
            currentView = view;
            document.getElementById('btnStudents').classList.toggle('active', view === 'students');
            document.getElementById('btnTeachers').classList.toggle('active', view === 'teachers');
            renderTable();
        }

        function renderTable() {
            const head = document.getElementById('tableHead');
            const body = document.getElementById('recordBody');

            if (currentView === 'students') {
                // Get fresh data from Enrollment page storage + defaults
                const enrolled = JSON.parse(localStorage.getItem('portal_students')) || [];
                const allStudents = [...defaultStudents, ...enrolled];

                head.innerHTML = `<tr class="text-muted small"><th>Name</th><th>LRN</th><th>Strand</th><th>Grade</th><th class="text-center">Action</th></tr>`;
                body.innerHTML = allStudents.map((s, i) => `
                    <tr>
                        <td class="fw-bold">${s.name}</td>
                        <td><code>${s.lrn || s.id}</code></td>
                        <td><span class="badge bg-light text-primary border">${s.strand}</span></td>
                        <td>Grade ${s.grade}</td>
                        <td class="text-center"><button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="viewStudent(${i})">View Profile</button></td>
                    </tr>`).join('');
            } else {
                head.innerHTML = `<tr class="text-muted small"><th>Teacher Name</th><th>ID</th><th>Department</th><th>Status</th><th class="text-center">Action</th></tr>`;
                body.innerHTML = teacherData.map((t, i) => `
                    <tr>
                        <td class="fw-bold">${t.name}</td>
                        <td><code>${t.id}</code></td>
                        <td>${t.dept}</td>
                        <td><span class="badge bg-success">Active</span></td>
                        <td class="text-center"><button class="btn btn-sm btn-primary rounded-pill px-3" onclick="viewTeacher(${i})">Details</button></td>
                    </tr>`).join('');
            }
        }

        function viewStudent(i) {
            const enrolled = JSON.parse(localStorage.getItem('portal_students')) || [];
            const s = [...defaultStudents, ...enrolled][i];
            document.getElementById('profileContent').innerHTML = `
                <div class="text-center mb-4">
                    <img src="https://ui-avatars.com/api/?name=${s.name.replace(' ', '+')}&size=100&background=random" class="rounded-circle shadow-sm mb-2">
                    <h4 class="fw-bold mb-0">${s.name}</h4>
                    <p class="text-muted small">Student ID: ${s.lrn || s.id}</p>
                </div>
                <div class="row g-2">
                    <div class="col-6"><div class="p-3 bg-light rounded-3 text-center"><small class="text-muted d-block">Strand</small><b>${s.strand}</b></div></div>
                    <div class="col-6"><div class="p-3 bg-light rounded-3 text-center"><small class="text-muted d-block">Grade</small><b>${s.grade}</b></div></div>
                    <div class="col-12 mt-3 text-center">
                        <p class="mb-0">Academic Standing: <span class="text-primary fw-bold">${s.gwa || 'Evaluating...'}</span></p>
                    </div>
                </div>`;
            new bootstrap.Modal(document.getElementById('profileModal')).show();
        }

        function viewTeacher(i) {
            const t = teacherData[i];
            document.getElementById('profileContent').innerHTML = `
                <div class="text-center mb-4">
                    <img src="https://ui-avatars.com/api/?name=${t.name.replace(' ', '+')}&size=100&background=0067ba&color=fff" class="rounded-circle shadow-sm mb-2">
                    <h4 class="fw-bold mb-0">${t.name}</h4>
                    <p class="text-muted small">${t.dept} Faculty</p>
                </div>
                <h6 class="fw-bold small text-muted mb-2">Current Subjects</h6>
                <div class="d-flex flex-wrap gap-2">
                    ${t.subjects.map(sub => `<span class="badge bg-soft-primary text-primary border">${sub}</span>`).join('')}
                </div>`;
            new bootstrap.Modal(document.getElementById('profileModal')).show();
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }
    </script>

    <style>
        .bg-soft-primary { background-color: #e7f1ff; }
        code { color: #5700de; font-weight: 600; }
    </style>
</body>
</html>
