<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar | Document Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--accent-bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* --- NAVIGATION (Unified Sidebar Style) --- */
        .navbar { 
            background: var(--sidebar-bg); 
            height: 100vh; 
            position: fixed; 
            width: 260px; 
            padding: 2rem 1.2rem; 
            z-index: 1050;
            align-items: flex-start;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 12px 15px; 
            border-radius: 12px; 
            margin-bottom: 5px; 
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
        }

        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }

        .top-header {
            margin-left: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 2rem; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 60px; 
        }

        /* --- MAIN CONTENT AREA --- */
        main { 
            margin-left: 260px; 
            height: calc(100vh - 60px); 
            padding: 2.5rem; 
            overflow-y: auto; 
        }

        .request-card { 
            background: var(--white); 
            border-radius: 20px; 
            padding: 1.5rem; 
            box-shadow: var(--shadow); 
            border: none; 
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { 
                width: 100%; 
                height: auto; 
                position: fixed; 
                top: 0; 
                padding: 0.7rem 1rem; 
                flex-direction: row !important; 
            }
            .top-header { margin-left: 0; margin-top: 55px; height: 50px; padding: 0 1rem; }
            main { margin-left: 0; height: auto; padding: 1.5rem; overflow: visible; }
            .navbar-collapse { 
                background: var(--sidebar-bg); 
                position: absolute; 
                top: 55px; 
                left: 0; 
                width: 100%; 
                padding: 1rem; 
                border-radius: 0 0 20px 20px; 
            }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="fas fa-university me-2"></i> 
                    <span class="desktop-only">Registrar Portal</span>
                    <span class="d-lg-none">Portal</span>
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-th-large me-2"></i> Overview</a></li>
                    <li class="nav-item"><a class="nav-link" href="Enrollment.html"><i class="fas fa-user-plus me-2"></i> Enrollment</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Request.html"><i class="fas fa-file-invoice me-2"></i> Requests</a></li>
                    <li class="nav-item"><a class="nav-link" href="Records.html"><i class="fas fa-clipboard-list me-2"></i> Records</a></li>
                    <li class="nav-item mt-lg-5">
                        <a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()">
                            <i class="fas fa-power-off me-2"></i> Log out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="Profile.html" class="d-flex align-items-center gap-2 text-decoration-none">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName" style="font-size: 0.8rem;">Loading...</p>
                <small class="text-muted" id="headerID" style="font-size: 0.65rem;">ID: ---</small>
            </div>
            <img src="" id="headerAvatar" class="rounded-circle border border-primary p-1" width="35" height="35" alt="Profile" style="object-fit: cover;">
        </a>
    </header>

    <main>
        <div class="d-md-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0" style="color: var(--primary);">Document Requests</h3>
                <p class="text-muted small">Process and track document applications.</p>
            </div>
            <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#requestModal" onclick="clearForm()">
                <i class="fas fa-plus me-2"></i>New Request
            </button>
        </div>

        <div class="request-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr class="text-muted small">
                            <th>Requester Name</th><th>Role</th><th>Document</th><th>Status</th><th>Last Update</th><th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestBody">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold" id="modalTitle">Request Form</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="requestForm">
                    <input type="hidden" id="editIndex">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="reqName" class="form-control bg-light border-0" required placeholder="Enter name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Role</label>
                            <select id="reqRole" class="form-select bg-light border-0">
                                <option value="Student">Student</option>
                                <option value="Teacher">Teacher/Faculty</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Document Type</label>
                            <select id="reqDoc" class="form-select bg-light border-0">
                                <option>Transcript of Records (TOR)</option>
                                <option>Certificate of Good Moral</option>
                                <option>Service Record</option>
                                <option>Certificate of Employment</option>
                                <option>Diploma Duplicate</option>
                                <option>Form 137</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Status</label>
                            <select id="reqStatus" class="form-select bg-light border-0">
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Ready">Ready for Pickup</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Save Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DATA PERSISTENCE ---
        let requests = JSON.parse(localStorage.getItem('docRequests')) || [
            { name: "Juan Dela Cruz", role: "Student", doc: "Transcript of Records (TOR)", status: "Processing", date: "03/05/2026" },
            { name: "Maria Santos", role: "Student", doc: "Certificate of Good Moral", status: "Ready", date: "03/06/2026" },
            { name: "Prof. Alberto Reyes", role: "Teacher", doc: "Service Record", status: "Pending", date: "03/08/2026" }
        ];

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            syncHeader();
            renderRequests();
        });

        function syncHeader() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if(user) {
                document.getElementById('headerName').innerText = user.name;
                document.getElementById('headerID').innerText = `ID: ${user.portalId}`;
                const avatar = document.getElementById('headerAvatar');
                if(user.profilePic) avatar.src = user.profilePic;
                else avatar.src = `https://ui-avatars.com/api/?name=${user.name.replace(' ', '+')}&background=0067ba&color=fff`;
            }
        }

        // --- CRUD ACTIONS ---
        function renderRequests() {
            const body = document.getElementById('requestBody');
            body.innerHTML = requests.map((r, i) => `
                <tr>
                    <td><div class="fw-bold">${r.name}</div></td>
                    <td><span class="small text-uppercase fw-bold text-muted">${r.role}</span></td>
                    <td>${r.doc}</td>
                    <td><span class="badge ${getStatusClass(r.status)}">${r.status}</span></td>
                    <td class="small text-muted">${r.date}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-light text-primary border-0 me-1" onclick="editRequest(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-light text-danger border-0" onclick="deleteRequest(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
            localStorage.setItem('docRequests', JSON.stringify(requests));
        }

        function getStatusClass(s) {
            if(s === 'Pending') return 'bg-secondary';
            if(s === 'Processing') return 'bg-warning text-dark';
            if(s === 'Ready') return 'bg-info text-white';
            return 'bg-success';
        }

        document.getElementById('requestForm').onsubmit = function(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const newData = {
                name: document.getElementById('reqName').value,
                role: document.getElementById('reqRole').value,
                doc: document.getElementById('reqDoc').value,
                status: document.getElementById('reqStatus').value,
                date: new Date().toLocaleDateString()
            };

            if(index === "") requests.push(newData);
            else requests[index] = newData;

            renderRequests();
            bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
        };

        function editRequest(i) {
            const r = requests[i];
            document.getElementById('modalTitle').innerText = "Edit Request";
            document.getElementById('editIndex').value = i;
            document.getElementById('reqName').value = r.name;
            document.getElementById('reqRole').value = r.role;
            document.getElementById('reqDoc').value = r.doc;
            document.getElementById('reqStatus').value = r.status;
            new bootstrap.Modal(document.getElementById('requestModal')).show();
        }

        function deleteRequest(i) {
            if(confirm("Delete this request?")) {
                requests.splice(i, 1);
                renderRequests();
            }
        }

        function clearForm() {
            document.getElementById('requestForm').reset();
            document.getElementById('editIndex').value = "";
            document.getElementById('modalTitle').innerText = "New Request";
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
