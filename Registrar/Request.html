<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar | Document Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body { background-color: var(--accent-bg); font-family: 'Inter', sans-serif; color: #2d3436; overflow-x: hidden; }

        /* --- SIDEBAR & HEADER --- */
        .sidebar { background: var(--sidebar-bg); height: 100vh; position: fixed; width: 260px; transition: 0.3s; z-index: 1100; }
        .nav-link { color: rgba(255,255,255,0.7) !important; padding: 12px 15px; border-radius: 12px; margin: 0.2rem 1rem; transition: 0.3s; display: flex; align-items: center; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }
        .top-header { margin-left: 260px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 0 1.5rem; display: flex; justify-content: flex-end; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; height: 65px; transition: 0.3s; }
        main { margin-left: 260px; padding: 2rem; transition: 0.3s; }

        .request-card { background: var(--white); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.03); }

        @media (max-width: 991px) {
            .sidebar { margin-left: -260px; }
            .sidebar.active { margin-left: 0; }
            .top-header, main { margin-left: 0; }
            .mobile-toggle { display: block !important; }
        }
        
        .mobile-toggle { display: none; position: absolute; left: 15px; top: 18px; font-size: 1.5rem; color: var(--primary); cursor: pointer; z-index: 1200; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="p-4"><h4 class="text-white fw-bold"><i class="fas fa-university me-2"></i>Registrar</h4></div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="Dashboard.html"><i class="fas fa-th-large me-3"></i>Overview</a></li>
            <li class="nav-item"><a class="nav-link" href="Enrollment.html"><i class="fas fa-user-plus me-3"></i>Enrollment</a></li>
            <li class="nav-item"><a class="nav-link active" href="Request.html"><i class="fas fa-file-invoice me-3"></i>Requests</a></li>
            <li class="nav-item"><a class="nav-link" href="Records.html"><i class="fas fa-clipboard-list me-3"></i>Records</a></li>
            <li class="nav-item mt-5"><a class="nav-link text-warning" href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-power-off me-3"></i>Log out</a></li>
        </ul>
    </nav>

    <header class="top-header">
        <div class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <a href="Profile.html" class="d-flex align-items-center gap-3 text-decoration-none" style="cursor:pointer;">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName">Registrar Officer</p>
                <small class="text-muted" id="headerID">ID: REG-2026</small>
            </div>
            <img id="headerAvatar" src="https://ui-avatars.com/api/?name=Registrar+Officer&background=0067ba&color=fff" class="rounded-circle border border-primary p-1" width="40" height="40" style="object-fit: cover;">
        </a>
    </header>

    <main>
        <div class="d-md-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-primary">Document Requests</h2>
                <p class="text-muted">Process and track student and faculty document applications.</p>
            </div>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#requestModal" onclick="clearForm()">
                <i class="fas fa-plus me-2"></i>New Request
            </button>
        </div>

        <div class="request-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr class="text-muted small">
                            <th>Requester Name</th><th>Type</th><th>Document</th><th>Status</th><th>Last Update</th><th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestBody"></tbody>
                </table>
            </div>
        </div>

        <div class="modal fade" id="requestModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content" style="border-radius: 20px;">
                    <div class="modal-header border-0">
                        <h5 class="fw-bold" id="modalTitle">Request Form</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="requestForm">
                        <input type="hidden" id="editIndex">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="small fw-bold">Requester Name</label>
                                <input type="text" id="reqName" class="form-control" placeholder="Student or Teacher name" required>
                            </div>
                            <div class="mb-3">
                                <label class="small fw-bold">Role</label>
                                <select id="reqRole" class="form-select">
                                    <option value="Student">Student</option>
                                    <option value="Teacher">Teacher/Faculty</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="small fw-bold">Document Type</label>
                                <select id="reqDoc" class="form-select">
                                    <option>Transcript of Records (TOR)</option>
                                    <option>Certificate of Good Moral</option>
                                    <option>Service Record (Faculty Only)</option>
                                    <option>Certificate of Employment (Faculty Only)</option>
                                    <option>Diploma Duplicate</option>
                                    <option>Form 137</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="small fw-bold">Status</label>
                                <select id="reqStatus" class="form-select">
                                    <option value="Pending">Pending</option>
                                    <option value="Processing">Processing</option>
                                    <option value="Ready">Ready for Pickup</option>
                                    <option value="Completed">Completed</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="submit" class="btn btn-primary w-100">Save Request</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DATA PERSISTENCE ---
        const getRequests = () => {
            let data = JSON.parse(localStorage.getItem('docRequests'));
            if (!data || data.length === 0) {
                data = [
                    { name: "Juan Dela Cruz", role: "Student", doc: "Transcript of Records (TOR)", status: "Processing", date: "03/05/2026" },
                    { name: "Maria Santos", role: "Student", doc: "Certificate of Good Moral", status: "Ready", date: "03/06/2026" },
                    { name: "Prof. Alberto Reyes", role: "Teacher", doc: "Service Record (Faculty Only)", status: "Pending", date: "03/08/2026" },
                    { name: "Ms. Elena Gomez", role: "Teacher", doc: "Certificate of Employment (Faculty Only)", status: "Completed", date: "03/01/2026" },
                    { name: "Alex Lim", role: "Student", doc: "Form 137", status: "Pending", date: "03/08/2026" }
                ];
                localStorage.setItem('docRequests', JSON.stringify(data));
            }
            return data;
        };

        const saveRequests = (data) => localStorage.setItem('docRequests', JSON.stringify(data));

        function renderRequests() {
            const reqs = getRequests();
            const body = document.getElementById('requestBody');
            body.innerHTML = reqs.map((r, i) => `
                <tr>
                    <td>
                        <div class="fw-bold">${r.name}</div>
                        <small class="text-muted">${r.role}</small>
                    </td>
                    <td><span class="small text-uppercase fw-bold text-muted">${r.role}</span></td>
                    <td>${r.doc}</td>
                    <td><span class="badge ${getStatusClass(r.status)}">${r.status}</span></td>
                    <td class="small text-muted">${r.date}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editRequest(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRequest(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusClass(s) {
            if(s === 'Pending') return 'bg-secondary';
            if(s === 'Processing') return 'bg-warning text-dark';
            if(s === 'Ready') return 'bg-info text-white';
            return 'bg-success';
        }

        // --- FORM ACTIONS ---
        document.getElementById('requestForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const reqs = getRequests();
            const index = document.getElementById('editIndex').value;
            const newData = {
                name: document.getElementById('reqName').value,
                role: document.getElementById('reqRole').value,
                doc: document.getElementById('reqDoc').value,
                status: document.getElementById('reqStatus').value,
                date: new Date().toLocaleDateString()
            };

            if(index === "") reqs.push(newData);
            else reqs[index] = newData;

            saveRequests(reqs);
            renderRequests();
            bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
        });

        function editRequest(i) {
            const r = getRequests()[i];
            document.getElementById('modalTitle').innerText = "Edit Request";
            document.getElementById('editIndex').value = i;
            document.getElementById('reqName').value = r.name;
            document.getElementById('reqRole').value = r.role;
            document.getElementById('reqDoc').value = r.doc;
            document.getElementById('reqStatus').value = r.status;
            new bootstrap.Modal(document.getElementById('requestModal')).show();
        }

        function deleteRequest(i) {
            if(confirm("Delete this request?")) {
                const reqs = getRequests();
                reqs.splice(i, 1);
                saveRequests(reqs);
                renderRequests();
            }
        }

        function clearForm() {
            document.getElementById('requestForm').reset();
            document.getElementById('editIndex').value = "";
            document.getElementById('modalTitle').innerText = "New Request";
        }

        // --- UI HELPERS ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderRequests();
            
            // Sync Header with Profile Settings
            const userJson = localStorage.getItem('currentUser');
            if (userJson) {
                const user = JSON.parse(userJson);
                if (user.name) document.getElementById('headerName').innerText = user.name;
                if (user.profilePic) document.getElementById('headerAvatar').src = user.profilePic;
            }
        });

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
