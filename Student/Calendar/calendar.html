<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar | Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body { 
            background-color: var(--accent-bg); 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            color: var(--text-main);
            min-width: 300px;
        }

        /* --- NAVIGATION --- */
        .navbar { 
            background: var(--sidebar-bg); 
            z-index: 1050;
            padding: 0.8rem 1.5rem;
        }

        /* Desktop Sidebar Setup */
        @media (min-width: 992px) {
            .navbar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                width: 260px;
                flex-direction: column !important;
                align-items: flex-start !important;
                padding: 2rem 1.2rem;
            }
            .navbar-collapse {
                width: 100%;
                align-items: flex-start;
            }
            .navbar-nav {
                flex-direction: column !important;
                width: 100%;
                margin-top: 2rem;
            }
            main, .top-header {
                margin-left: 260px;
            }
        }

        .nav-link { 
            color: rgba(255,255,255,0.8) !important; 
            padding: 12px 18px !important; 
            border-radius: 12px; 
            margin-bottom: 5px; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
        }

        .nav-link i { width: 30px; font-size: 1.1rem; }

        .nav-link:hover, .nav-link.active { 
            background: rgba(255,255,255,0.15); 
            color: #fff !important; 
        }

        /* --- TOP HEADER (Profile Area) --- */
        .top-header {
            background: var(--white);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-pic {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 2px;
            background: white;
        }

        @media (max-width: 991px) {
            .top-header { padding: 0.5rem 1rem; }
            .navbar-brand { font-weight: bold; }
        }

        /* --- CALENDAR STYLING --- */
        main { padding: 2rem; }
        
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .month-card { 
            background: var(--white); 
            border-radius: 20px; 
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .month-header { padding: 1.2rem; text-align: center; background: #fafbfc; border-bottom: 1px solid #eee; }
        .month-name { color: var(--primary); font-weight: 800; font-size: 1.2rem; margin: 0; }
        .calendar-body { padding: 1.2rem; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; font-weight: 700; color: #b2bec3; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-node { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border-radius: 8px; }
        
        .view-activities-btn {
            width: 100%; background: #f0f7ff; color: var(--primary); border: none;
            padding: 10px; border-radius: 0 0 20px 20px; font-weight: 700; transition: 0.3s;
        }
        .view-activities-btn:hover { background: var(--primary); color: white; }

        @media (max-width: 576px) {
            main { padding: 1rem; }
            .calendar-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid flex-lg-column align-items-stretch">
            <a class="navbar-brand fw-bold mb-lg-4" href="#">
                <i class="fas fa-graduation-cap me-2"></i>Portal
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav w-100">
                    <li class="nav-item"><a class="nav-link" href="../Dashboard/homepage.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Strand/Strand.html"><i class="fas fa-layer-group"></i> Strand</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-calendar-alt"></i> Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Messages/messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
                    <li class="nav-item mt-lg-auto">
                        <a class="nav-link text-warning" href="../../Login Page/index.html" onclick="localStorage.removeItem('currentUser')">
                            <i class="fas fa-sign-out-alt"></i> Log out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="../Dashboard/Profile/index.html" class="text-decoration-none d-flex align-items-center gap-3">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName" style="font-size: 0.9rem;">Student Name</p>
                <small class="text-muted" id="headerID">ID: 0000-000</small>
            </div>
            <img src="../Dashboard/Profile/Pictures/profile.jpg" 
                 id="headerProfilePic" 
                 class="header-pic" 
                 onerror="this.src='https://ui-avatars.com/api/?name=User&background=0067ba&color=fff'">
        </a>
    </header>

    <main>
        <div class="mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Academic Calendar 2026</h2>
            <p class="text-muted small">Stay updated with the latest school events.</p>
        </div>
        
        <div class="calendar-grid" id="calendar-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            if (userJson) {
                const user = JSON.parse(userJson);
                document.getElementById('headerName').innerText = user.name || "Student Name";
                document.getElementById('headerID').innerText = `ID: ${user.portalId || '0000'}`;
                
                // --- PFP LOGIC ---
                const savedPhoto = localStorage.getItem(`photo_${user.portalId}`);
                const profileImg = document.getElementById('headerProfilePic');
                
                if (savedPhoto && savedPhoto.startsWith('data:image')) {
                    profileImg.src = savedPhoto;
                } else {
                    // Generates initials if no photo is found
                    const nameParts = (user.name || "Student").split(' ');
                    const initials = nameParts.length > 1 ? nameParts[0][0] + nameParts[1][0] : nameParts[0][0];
                    profileImg.src = `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
                }
            }
        });

        // Calendar Logic
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const container = document.getElementById('calendar-container');

        months.forEach((name, index) => {
            const date = new Date(2026, index, 1);
            const firstDay = date.getDay();
            const daysInMonth = new Date(2026, index + 1, 0).getDate();

            let daysHTML = '';
            for (let i = 0; i < firstDay; i++) daysHTML += `<div class="day-node"></div>`;
            for (let d = 1; d <= daysInMonth; d++) daysHTML += `<div class="day-node">${d}</div>`;

            container.innerHTML += `
                <div class="month-card">
                    <div class="month-header"><h3 class="month-name">${name}</h3></div>
                    <div class="calendar-body">
                        <div class="weekdays"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div>
                        <div class="days-grid">${daysHTML}</div>
                    </div>
                    <button class="view-activities-btn">View Activities</button>
                </div>
            `;
        });
    </script>
</body>
</html>
