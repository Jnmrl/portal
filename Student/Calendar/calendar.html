<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar | Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body { 
            background-color: var(--accent-bg); 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0;
            color: var(--text-main);
            overflow-x: hidden;
            min-width: 300px;
        }

        /* --- SIDEBAR (Updated to match Index) --- */
        .navbar { 
            background: var(--sidebar-bg); 
            min-height: 100vh; 
            position: fixed; 
            width: 260px; 
            padding: 2rem 1.2rem; 
            z-index: 1050;
            align-items: flex-start;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 14px 20px; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            text-decoration: none;
            width: 100%;
        }

        .nav-link i { width: 25px; font-size: 1.1rem; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }

        /* --- TOP HEADER --- */
        .top-header {
            margin-left: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.8rem 2.5rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-profile { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: var(--text-main); 
            gap: 12px; 
        }

        .header-pic { 
            border: 2px solid var(--primary); 
            padding: 2px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: #fff;
        }

        /* --- MAIN CONTENT --- */
        main { margin-left: 260px; padding: 2.5rem; transition: 0.3s; }

        /* --- CALENDAR SPECIFIC --- */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .month-card { 
            background: var(--white); 
            border-radius: 20px; 
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .month-header { padding: 1.2rem; text-align: center; background: #fafbfc; border-bottom: 1px solid #eee; }
        .month-name { color: var(--primary); font-weight: 800; font-size: 1.2rem; margin: 0; }
        .calendar-body { padding: 1.2rem; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; font-weight: 700; color: #b2bec3; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-node { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border-radius: 8px; }
        
        .view-activities-btn {
            width: 100%; background: #f0f7ff; color: var(--primary); border: none;
            padding: 12px; font-weight: 700; transition: 0.3s;
        }
        .view-activities-btn:hover { background: var(--primary); color: white; }

        /* --- MOBILE RESPONSIVE (Matching Index) --- */
        @media (max-width: 991px) {
            .navbar { width: 100%; min-height: auto; position: fixed; top: 0; padding: 0.8rem 1rem; flex-direction: row !important; }
            .top-header { margin-left: 0; margin-top: 65px; padding: 0.8rem 1.5rem; }
            main { margin-left: 0; padding: 1.5rem; }
            .desktop-only { display: none; }
            .navbar-collapse { background: var(--sidebar-bg); position: absolute; top: 60px; left: 0; width: 100%; padding: 1.5rem; border-radius: 0 0 20px 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="user-brand-mobile d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                    <i class="fas fa-graduation-cap me-2"></i> 
                    <span class="desktop-only">Portal</span>
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="../Dashboard/index.html"><i class="fas fa-th-large me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Strand/Strand.html"><i class="fas fa-layer-group me-2"></i> Strand</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-calendar-alt me-2"></i> Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Messages/messages.html"><i class="fas fa-envelope me-2"></i> Messages</a></li>
                    <li class="nav-item mt-lg-5">
                        <a class="nav-link text-danger" href="../../index.html" onclick="localStorage.removeItem('currentUser')">
                            <i class="fas fa-sign-out-alt me-2"></i> Log out
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="../Dashboard/Profile/index.html" class="header-profile">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName">Student Name</p>
                <small class="text-muted" id="headerID">ID: 0000-000</small>
            </div>
            <img src="../Dashboard/Profile/Pictures/profile.jpg" id="headerProfilePic" class="header-pic" width="45" height="45" onerror="this.src='https://ui-avatars.com/api/?name=User&background=0067ba&color=fff'">
        </a>
    </header>

    <main>
        <div class="mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Academic Calendar 2026</h2>
            <p class="text-muted small">Stay updated with the latest school events.</p>
        </div>
        
        <div class="calendar-grid" id="calendar-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            if (userJson) {
                const user = JSON.parse(userJson);
                document.getElementById('headerName').innerText = user.name || "Student Name";
                document.getElementById('headerID').innerText = `ID: ${user.portalId || '0000'}`;
                
                const savedPhoto = localStorage.getItem(`photo_${user.portalId}`);
                const profileImg = document.getElementById('headerProfilePic');
                
                if (savedPhoto) {
                    profileImg.src = savedPhoto;
                }
            }
        });

        // Calendar Logic
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const container = document.getElementById('calendar-container');

        months.forEach((name, index) => {
            const date = new Date(2026, index, 1);
            const firstDay = date.getDay();
            const daysInMonth = new Date(2026, index + 1, 0).getDate();

            let daysHTML = '';
            for (let i = 0; i < firstDay; i++) daysHTML += `<div class="day-node"></div>`;
            for (let d = 1; d <= daysInMonth; d++) daysHTML += `<div class="day-node">${d}</div>`;

            container.innerHTML += `
                <div class="month-card">
                    <div class="month-header"><h3 class="month-name">${name}</h3></div>
                    <div class="calendar-body">
                        <div class="weekdays"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div>
                        <div class="days-grid">${daysHTML}</div>
                    </div>
                    <button class="view-activities-btn">View Activities</button>
                </div>
            `;
        });
    </script>
</body>
</html>
