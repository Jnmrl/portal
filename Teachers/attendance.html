<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Teacher Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --text-dark: #2d3436; /* High contrast text */
            --text-muted: #636e72;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body { height: 100%; overflow: hidden; background-color: var(--accent-bg); font-family: 'Inter', sans-serif; color: var(--text-dark); }

        .navbar { background: var(--sidebar-bg); height: 100vh; position: fixed; width: 260px; padding: 2rem 1.2rem; z-index: 1050; align-items: flex-start; }
        .nav-link { color: rgba(255,255,255,0.7) !important; padding: 12px 15px; border-radius: 12px; margin-bottom: 5px; display: flex; align-items: center; transition: 0.3s; text-decoration: none; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }
        
        .top-header { margin-left: 260px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 0 2rem; display: flex; justify-content: flex-end; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; height: 60px; }
        main { margin-left: 260px; height: calc(100vh - 60px); padding: 2rem; overflow-y: auto; }

        /* Visibility Fixes for Text */
        h2, h3, h4 { color: var(--text-dark) !important; font-weight: 700; }
        .text-muted { color: var(--text-muted) !important; }

        .section-box {
            background: var(--white);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            box-shadow: var(--shadow);
        }
        .section-box:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #dfe6e9;
        }

        .student-name { color: var(--text-dark); font-weight: 600; font-size: 1rem; }

        .status-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #b2bec3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 800;
            color: var(--text-dark);
        }
        .status-p.active { background: #2ecc71; color: white; border-color: #27ae60; }
        .status-a.active { background: #e74c3c; color: white; border-color: #c0392b; }
        .status-l.active { background: #f1c40f; color: #2d3436; border-color: #f39c12; }

        /* History Table Visibility */
        .history-card { background: white; border-radius: 15px; padding: 25px; box-shadow: var(--shadow); border: 1px solid #dcdde1; }
        .table thead th { color: var(--text-dark); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; border-bottom: 2px solid #eee; }
        .table tbody td { color: var(--text-dark); font-weight: 500; padding: 12px 8px; }

        /* High Contrast Badges for History */
        .badge-p { background: #d4edda; color: #155724; font-weight: 700; border: 1px solid #c3e6cb; }
        .badge-a { background: #f8d7da; color: #721c24; font-weight: 700; border: 1px solid #f5c6cb; }
        .badge-l { background: #fff3cd; color: #856404; font-weight: 700; border: 1px solid #ffeeba; }

        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { width: 100%; height: auto; position: fixed; top: 0; padding: 0.7rem 1rem; flex-direction: row !important; }
            .top-header { margin-left: 0; margin-top: 55px; height: 50px; }
            main { margin-left: 0; height: auto; padding: 1rem; }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="homepage.html">
                    <i class="fas fa-chalkboard-teacher me-2"></i> 
                    <span class="desktop-only">Teacher Portal</span>
                </a>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="student.html"><i class="fas fa-users me-2"></i> My Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="curriculum.html"><i class="fas fa-book-open me-2"></i> Curriculum</a></li>
                    <li class="nav-item"><a class="nav-link active" href="attendance.html"><i class="fas fa-calendar-check me-2"></i> Attendance</a></li>
                    <li class="nav-item mt-lg-5"><a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> Log out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none" style="cursor: pointer;">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName" style="font-size: 0.85rem;">Professor</p>
                <small class="text-muted fw-bold" id="headerID" style="font-size: 0.7rem;">Portal ID</small>
            </div>
            <img src="" id="headerProfilePic" class="rounded-circle border border-primary p-1" width="35" height="35" alt="User Profile">
        </a>
    </header>

    <main>
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold mb-1">Attendance Monitoring</h2>
                <p class="text-muted fw-bold">Manage daily records or track monthly history.</p>
            </div>
            <ul class="nav nav-pills bg-white p-1 rounded-3 shadow-sm border">
                <li class="nav-item">
                    <button class="nav-link active py-2 px-4 fw-bold" id="record-tab" onclick="switchView('record')">Daily Record</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link py-2 px-4 fw-bold" id="history-tab" onclick="switchView('history')">Monthly History</button>
                </li>
            </ul>
        </div>

        <div id="view-record">
            <div class="row g-4" id="sectionContainer">
                <div class="col-md-4">
                    <div class="section-box text-center" onclick="showAttendance('Quezon')">
                        <i class="fas fa-users fa-3x mb-3 text-primary"></i>
                        <h4 class="fw-bold">Quezon</h4>
                        <p class="text-dark fw-bold mb-0" id="count-Quezon">Loading...</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="section-box text-center" onclick="showAttendance('Lapu-Lapu')">
                        <i class="fas fa-users fa-3x mb-3 text-success"></i>
                        <h4 class="fw-bold">Lapu-Lapu</h4>
                        <p class="text-dark fw-bold mb-0" id="count-Lapu-Lapu">Loading...</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="section-box text-center" onclick="showAttendance('Escoda')">
                        <i class="fas fa-users fa-3x mb-3 text-warning"></i>
                        <h4 class="fw-bold">Escoda</h4>
                        <p class="text-dark fw-bold mb-0" id="count-Escoda">Loading...</p>
                    </div>
                </div>
            </div>

            <div id="attendanceList" class="mt-4 d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-sm btn-dark px-3 fw-bold" onclick="backToSections()"><i class="fas fa-arrow-left me-2"></i>Back</button>
                    <h3 id="currentSectionTitle" class="fw-bold mb-0 text-primary"></h3>
                    <button class="btn btn-primary shadow fw-bold" onclick="saveAttendance()">Submit Attendance</button>
                </div>
                <div class="bg-white rounded-4 shadow-sm p-2 border" id="studentListBody"></div>
            </div>
        </div>

        <div id="view-history" class="d-none">
            <div class="history-card">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="small fw-bold text-dark mb-1">Select Month</label>
                        <input type="month" id="historyMonth" class="form-control fw-bold border-primary" onchange="loadMonthlyHistory()">
                    </div>
                    <div class="col-md-4">
                        <label class="small fw-bold text-dark mb-1">Select Section</label>
                        <select id="historySection" class="form-select fw-bold" onchange="loadMonthlyHistory()">
                            <option value="All">All Sections</option>
                            <option value="Quezon">Quezon</option>
                            <option value="Lapu-Lapu">Lapu-Lapu</option>
                            <option value="Escoda">Escoda</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle border-top">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Student Details</th>
                                <th>Section</th>
                                <th class="text-center">Attendance Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const STORAGE_KEY_STUDENTS = 'portal_students';
        const STORAGE_KEY_RECORDS = 'portal_attendance_records';

        let students = JSON.parse(localStorage.getItem(STORAGE_KEY_STUDENTS)) || [
            { id: "2024-001", name: "Alice Johnson", section: "Quezon" },
            { id: "2024-002", name: "Bob Smith", section: "Quezon" },
            { id: "2024-005", name: "Mark Smith", section: "Escoda" },
            { id: "2024-012", name: "Sia Vang", section: "Lapu-Lapu" }
        ];

        let attendanceRecords = JSON.parse(localStorage.getItem(STORAGE_KEY_RECORDS)) || [];

        document.addEventListener('DOMContentLoaded', () => {
            loadHeaderData();
            updateCounts();
            const today = new Date().toISOString().slice(0, 7);
            document.getElementById('historyMonth').value = today;
        });

        function switchView(view) {
            if(view === 'record') {
                document.getElementById('view-record').classList.remove('d-none');
                document.getElementById('view-history').classList.add('d-none');
                document.getElementById('record-tab').classList.add('active');
                document.getElementById('history-tab').classList.remove('active');
            } else {
                document.getElementById('view-record').classList.add('d-none');
                document.getElementById('view-history').classList.remove('d-none');
                document.getElementById('record-tab').classList.remove('active');
                document.getElementById('history-tab').classList.add('active');
                loadMonthlyHistory();
            }
        }

        function showAttendance(sectionName) {
            document.getElementById('sectionContainer').classList.add('d-none');
            document.getElementById('attendanceList').classList.remove('d-none');
            document.getElementById('currentSectionTitle').innerText = sectionName;
            
            const sectionData = students.filter(s => s.section === sectionName);
            let listHtml = sectionData.length === 0 ? `<div class="text-center py-5 fw-bold text-muted">No students registered in this section.</div>` : "";

            sectionData.forEach(student => {
                listHtml += `
                    <div class="student-row" data-id="${student.id}" data-name="${student.name}" data-section="${student.section}">
                        <div>
                            <span class="student-name">${student.name}</span><br>
                            <small class="text-muted fw-bold">${student.id}</small>
                        </div>
                        <div class="d-flex gap-2">
                            <div class="status-btn status-p" onclick="toggleStatus(this, 'P')">P</div>
                            <div class="status-btn status-a" onclick="toggleStatus(this, 'A')">A</div>
                            <div class="status-btn status-l" onclick="toggleStatus(this, 'L')">L</div>
                        </div>
                    </div>`;
            });
            document.getElementById('studentListBody').innerHTML = listHtml;
        }

        function toggleStatus(btn, type) {
            btn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function saveAttendance() {
            const rows = document.querySelectorAll('.student-row');
            const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
            let newEntries = [];
            let allMarked = true;

            rows.forEach(row => {
                const selectedBtn = row.querySelector('.status-btn.active');
                if(!selectedBtn) { allMarked = false; return; }
                
                newEntries.push({
                    date: today,
                    studentId: row.getAttribute('data-id'),
                    name: row.getAttribute('data-name'),
                    section: row.getAttribute('data-section'),
                    status: selectedBtn.innerText
                });
            });

            if(!allMarked) { alert("Action Required: Please mark all students."); return; }

            attendanceRecords = [...attendanceRecords, ...newEntries];
            localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(attendanceRecords));
            alert("Success: Attendance for " + today + " has been saved.");
            backToSections();
        }

        function loadMonthlyHistory() {
            const filterMonth = document.getElementById('historyMonth').value;
            const filterSection = document.getElementById('historySection').value;
            const tableBody = document.getElementById('historyTableBody');
            
            const filtered = attendanceRecords.filter(record => {
                const recordMonth = record.date.slice(0, 7);
                return recordMonth === filterMonth && (filterSection === "All" || record.section === filterSection);
            });

            if(filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-5 fw-bold text-muted">No records found for the selected criteria.</td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered.map(r => `
                <tr>
                    <td class="fw-bold text-primary">${r.date}</td>
                    <td><span class="fw-bold">${r.name}</span><br><small class="text-muted">${r.studentId}</small></td>
                    <td><span class="badge bg-light text-dark border fw-bold">${r.section}</span></td>
                    <td class="text-center">
                        <span class="badge px-4 py-2 rounded-pill badge-${r.status.toLowerCase()}">
                            ${r.status === 'P' ? 'PRESENT' : r.status === 'A' ? 'ABSENT' : 'LATE'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function backToSections() {
            document.getElementById('sectionContainer').classList.remove('d-none');
            document.getElementById('attendanceList').classList.add('d-none');
            updateCounts();
        }

        function updateCounts() {
            ['Quezon', 'Lapu-Lapu', 'Escoda'].forEach(sec => {
                const count = students.filter(s => s.section === sec).length;
                const element = document.getElementById(`count-${sec}`);
                if(element) element.innerText = `${count} Student${count !== 1 ? 's' : ''}`;
            });
        }

        function loadHeaderData() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) { window.location.href = 'login.html'; return; }
            document.getElementById('headerName').innerText = user.name;
            document.getElementById('headerID').innerText = "ID: " + user.portalId;
            const headerPic = document.getElementById('headerProfilePic');
            const initials = user.name.split(' ').map(n => n[0]).join('+');
            headerPic.src = user.profilePic || `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
        }

        function handleLogout() {
            if(confirm("Confirm Logout?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
