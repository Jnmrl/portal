<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --secondary-accent: #ff9f43;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--accent-bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* --- SHARED SIDEBAR & HEADER (Matching Curriculum UI) --- */
        .navbar { 
            background: var(--sidebar-bg); 
            height: 100vh; 
            position: fixed; 
            width: 260px; 
            padding: 2rem 1.2rem; 
            z-index: 1050;
            align-items: flex-start;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 12px 15px; 
            border-radius: 12px; 
            margin-bottom: 5px; 
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
        }

        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }

        .top-header {
            margin-left: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 2rem; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 60px; 
        }

        main { 
            margin-left: 260px; 
            height: calc(100vh - 60px); 
            padding: 2rem; 
            overflow-y: auto; 
        }

        /* --- DASHBOARD SPECIFIC --- */
        .dashboard-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: 100%;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .grading-progress {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--secondary-accent) 65%, #e9ecef 0deg);
            display: flex; align-items: center; justify-content: center;
            margin: 1.5rem auto; position: relative;
        }
        .grading-progress::before {
            content: ""; position: absolute; width: 100px; height: 100px;
            border-radius: 50%; background-color: white;
        }
        .progress-value { position: relative; font-weight: bold; font-size: 1.4rem; color: var(--secondary-accent); }

        .lecture-scroll-container { max-height: 250px; overflow-y: auto; }

        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { width: 100%; height: auto; position: fixed; top: 0; padding: 0.7rem 1rem; flex-direction: row !important; }
            .top-header { margin-left: 0; margin-top: 55px; height: 50px; padding: 0 1rem; }
            main { margin-left: 0; height: auto; padding: 1rem; }
            .navbar-collapse { background: var(--sidebar-bg); position: absolute; top: 55px; left: 0; width: 100%; padding: 1rem; border-radius: 0 0 20px 20px; }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="fas fa-chalkboard-teacher me-2"></i> 
                    <span class="desktop-only">Teacher Portal</span>
                    <span class="d-lg-none">Portal</span> 
                </a>
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="student.html"><i class="fas fa-users me-2"></i> My Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="curriculum.html"><i class="fas fa-book-open me-2"></i> Curriculum</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check me-2"></i> Attendance</a></li>
                    <li class="nav-item mt-lg-5"><a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> Log out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" id="headerName" style="font-size: 0.8rem;">Professor</p>
                <small class="text-muted" id="headerID" style="font-size: 0.65rem;">ID: ---</small>
            </div>
            <img id="headerAvatar" src="" class="rounded-circle border border-primary p-1" width="32" height="32" alt="Profile" style="object-fit: cover;">
        </a>
    </header>

    <main>
        <div class="mb-4">
            <h2 class="fw-bold text-primary mb-0">Faculty Overview</h2>
            <p class="text-muted small" id="currentDateDisplay"></p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <div class="dashboard-card text-center">
                    <h6 class="fw-bold text-muted small text-uppercase">Grading Progress</h6>
                    <div class="grading-progress" id="gradingCircle">
                        <span class="progress-value">65%</span>
                    </div>
                    <p class="text-muted mb-0 small"><strong>12</strong> assignments pending</p>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="dashboard-card">
                    <h6 class="fw-bold text-muted small mb-3 text-uppercase">Today's Lectures</h6>
                    <div class="lecture-scroll-container" id="lectureList"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="dashboard-card">
                    <h6 class="fw-bold text-primary small mb-3 text-uppercase">Quick Announcement</h6>
                    <form id="announcementForm">
                        <div class="mb-2">
                            <select class="form-select form-select-sm" id="targetClass" required>
                                <option value="">Select Subject</option>
                                <option>Media Info Literacy</option>
                                <option>Entrepreneurship</option>
                                <option>Computer Systems</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <textarea class="form-control form-control-sm" id="annMsg" rows="3" placeholder="Write message..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">Post to Students</button>
                    </form>
                </div>
            </div>

            <div class="col-12 mb-4">
                <div class="dashboard-card p-0 overflow-hidden">
                    <div class="p-3 d-flex justify-content-between align-items-center border-bottom">
                        <h6 class="fw-bold text-muted small mb-0 text-uppercase">Recent Submissions</h6>
                        <span class="badge bg-primary" id="subCount">0</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr class="text-muted small">
                                    <th class="ps-3">Student</th>
                                    <th>Subject</th>
                                    <th>Status</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="submissionTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            if (!userJson) {
                window.location.href = '../index.html';
                return;
            }

            const user = JSON.parse(userJson);
            document.getElementById('headerName').innerText = user.name;
            document.getElementById('headerID').innerText = `ID: ${user.portalId}`;
            
            const avatarImg = document.getElementById('headerAvatar');
            if (user.profilePic) {
                avatarImg.src = user.profilePic;
            } else {
                const initials = user.name.split(' ').map(n => n[0]).join('+');
                avatarImg.src = `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
            }

            updateClock();
            loadDashboardData();
        });

        function updateClock() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }

        function loadDashboardData() {
            const lectures = [
                { time: '09:00 AM', subject: 'MIL', section: 'Quezon' },
                { time: '11:30 AM', subject: 'CS Servicing', section: 'Lapu-Lapu' },
                { time: '02:00 PM', subject: 'Entrep', section: 'Quezon' }
            ];

            document.getElementById('lectureList').innerHTML = lectures.map(l => `
                <div class="p-2 border-start border-primary border-4 bg-light mb-2 rounded shadow-sm">
                    <div class="d-flex justify-content-between">
                        <span class="small fw-bold">${l.subject}</span>
                        <span class="badge bg-white text-primary border">${l.time}</span>
                    </div>
                    <div class="small text-muted">${l.section}</div>
                </div>
            `).join('');

            const subs = [
                { name: 'Juan Dela Cruz', sub: 'MIL Quiz 1', status: 'Pending' },
                { name: 'Maria Santos', sub: 'Final Project', status: 'Graded' },
                { name: 'Alex Reyes', sub: 'Activity 4', status: 'Pending' }
            ];

            document.getElementById('submissionTable').innerHTML = subs.map(s => `
                <tr>
                    <td class="ps-3 fw-bold small">${s.name}</td>
                    <td><span class="small">${s.sub}</span></td>
                    <td><span class="badge ${s.status === 'Graded' ? 'bg-success' : 'bg-warning'}">${s.status}</span></td>
                    <td class="text-center"><button class="btn btn-sm btn-outline-primary py-0">View</button></td>
                </tr>
            `).join('');
            document.getElementById('subCount').innerText = subs.length;
        }

        document.getElementById('announcementForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert(`Announcement posted to ${document.getElementById('targetClass').value}!`);
            e.target.reset();
        });
    </script>
</body>
</html>
