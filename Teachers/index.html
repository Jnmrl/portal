<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --secondary-accent: #ff9f43;
            --text-main: #2d3436;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body {
            background-color: var(--accent-bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            background: var(--sidebar-bg); 
            height: 100vh; 
            position: fixed; 
            width: 260px; 
            transition: all 0.3s;
            z-index: 1100;
        }

        .nav-link { 
            color: rgba(255,255,255,0.7) !important; 
            padding: 12px 15px; 
            border-radius: 12px; 
            margin: 0.2rem 1rem;
            transition: 0.3s; 
            display: flex;
            align-items: center;
        }

        .nav-link:hover, .nav-link.active { 
            background: rgba(255,255,255,0.15); 
            color: #fff !important; 
        }

        /* --- TOP HEADER --- */
        .top-header {
            margin-left: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 1.5rem; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 65px; 
        }

        .header-profile-link {
            transition: opacity 0.2s ease;
            cursor: pointer;
        }
        .header-profile-link:hover {
            opacity: 0.8;
        }

        /* --- MAIN AREA --- */
        main { 
            margin-left: 260px; 
            padding: 2rem; 
            transition: all 0.3s;
        }

        .dashboard-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: 100%;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .grading-progress {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--secondary-accent) 65%, #e9ecef 0deg);
            display: flex; align-items: center; justify-content: center;
            margin: 1.5rem auto; position: relative;
        }
        .grading-progress::before {
            content: ""; position: absolute; width: 100px; height: 100px;
            border-radius: 50%; background-color: white;
        }
        .progress-value { position: relative; font-weight: bold; font-size: 1.4rem; color: var(--secondary-accent); }

        .lecture-scroll-container { max-height: 300px; overflow-y: auto; }

        @media (max-width: 991px) {
            .sidebar { margin-left: -260px; }
            .sidebar.active { margin-left: 0; }
            .top-header, main { margin-left: 0; }
            .mobile-toggle { display: block !important; }
        }

        .mobile-toggle { display: none; position: absolute; left: 15px; top: 18px; font-size: 1.5rem; color: var(--primary); cursor: pointer; }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="p-4">
            <h4 class="text-white fw-bold"><i class="fas fa-chalkboard-teacher me-2"></i>Portal</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-chart-line me-3"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="student.html"><i class="fas fa-users me-3"></i>My Students</a></li>
            <li class="nav-item"><a class="nav-link" href="curriculum.html"><i class="fas fa-book-open me-3"></i>Curriculum</a></li>
            <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check me-3"></i>Attendance</a></li>
            <li class="nav-item mt-5">
                <a class="nav-link text-warning" href="javascript:void(0)" onclick="handleLogout()">
                    <i class="fas fa-power-off me-3"></i>Log out
                </a>
            </li>
        </ul>
    </nav>

    <header class="top-header">
        <div class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        
        <a href="profile.html" class="d-flex align-items-center gap-3 text-decoration-none header-profile-link">
            <div class="text-end">
                <p class="fw-bold mb-0 text-dark" id="headerName">User Name</p>
                <small class="text-muted" id="headerID">ID: ---</small>
            </div>
            <img id="headerAvatar" src="" class="rounded-circle border border-primary p-1" width="40" height="40" alt="Profile" style="object-fit: cover;">
        </a>
    </header>

    <main>
        <div class="mb-4">
            <h2 class="fw-bold text-primary">Faculty Overview</h2>
            <p class="text-muted" id="currentDateDisplay"></p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <div class="dashboard-card text-center">
                    <h6 class="fw-bold text-muted small uppercase">Grading Progress</h6>
                    <div class="grading-progress" id="gradingCircle">
                        <span class="progress-value">65%</span>
                    </div>
                    <p class="text-muted mb-0"><strong>12</strong> assignments pending</p>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="dashboard-card">
                    <h6 class="fw-bold text-muted small mb-3">TODAY'S LECTURES</h6>
                    <div class="lecture-scroll-container" id="lectureList"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="dashboard-card">
                    <h6 class="fw-bold text-primary small mb-3">QUICK ANNOUNCEMENT</h6>
                    <form id="announcementForm">
                        <div class="mb-2">
                            <select class="form-select form-select-sm" id="targetClass" required>
                                <option value="">Select Subject</option>
                                <option>Media Info Literacy</option>
                                <option>Entrepreneurship</option>
                                <option>Computer Systems</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <textarea class="form-control form-control-sm" id="annMsg" rows="3" placeholder="Write message..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">Post to Students</button>
                    </form>
                </div>
            </div>

            <div class="col-12 mb-5">
                <div class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-muted small mb-0">RECENT SUBMISSIONS</h6>
                        <span class="badge bg-primary" id="subCount">3</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Student</th>
                                    <th>Subject</th>
                                    <th>Status</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="submissionTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. AUTH GUARD & INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            
            if (!userJson) {
                window.location.href = '../index.html';
                return;
            }

            const user = JSON.parse(userJson);
            
            // Populate Header Data
            document.getElementById('headerName').innerText = user.name;
            document.getElementById('headerID').innerText = `ID: ${user.portalId}`;
            
            // --- FIX FOR PROFILE PICTURE ---
            const avatarImg = document.getElementById('headerAvatar');
            
            // Check if user has an uploaded profile picture in the object
            if (user.profilePic) {
                avatarImg.src = user.profilePic;
            } else {
                // Fallback to UI Avatars if no picture is uploaded
                const initials = user.name.split(' ').map(n => n[0]).join('+');
                avatarImg.src = `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
            }

            updateClock();
            loadDashboardData();
        });

        function updateClock() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);
        }

        function handleLogout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }

        function loadDashboardData() {
            const lectures = [
                { time: '09:00 AM', subject: 'MIL', section: 'Quezon' },
                { time: '11:30 AM', subject: 'CS Servicing', section: 'Lapu-Lapu' },
                { time: '02:00 PM', subject: 'Entrep', section: 'Quezon' }
            ];

            const lectureList = document.getElementById('lectureList');
            lectureList.innerHTML = lectures.map(l => `
                <div class="p-2 border-start border-primary border-4 bg-light mb-2 rounded shadow-sm">
                    <div class="d-flex justify-content-between">
                        <span class="small fw-bold">${l.subject}</span>
                        <span class="badge bg-white text-primary border">${l.time}</span>
                    </div>
                    <div class="small text-muted">${l.section}</div>
                </div>
            `).join('');

            const subs = [
                { name: 'Juan Dela Cruz', sub: 'MIL Quiz 1', status: 'Pending' },
                { name: 'Maria Santos', sub: 'Final Project', status: 'Graded' },
                { name: 'Alex Reyes', sub: 'Activity 4', status: 'Pending' }
            ];

            document.getElementById('submissionTable').innerHTML = subs.map(s => `
                <tr>
                    <td class="fw-bold small">${s.name}</td>
                    <td><span class="small">${s.sub}</span></td>
                    <td><span class="badge ${s.status === 'Graded' ? 'bg-success' : 'bg-warning'}">${s.status}</span></td>
                    <td class="text-center"><button class="btn btn-sm btn-outline-primary py-0">View</button></td>
                </tr>
            `).join('');
            document.getElementById('subCount').innerText = subs.length;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.getElementById('announcementForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const subject = document.getElementById('targetClass').value;
            alert(`Announcement posted to all students in ${subject}!`);
            e.target.reset();
        });
    </script>
</body>
</html>
