<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: linear-gradient(180deg, #0067ba, #5700de);
            --accent-bg: #f0f4f8; 
            --white: #ffffff;
            --primary: #0067ba;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        html, body { height: 100%; overflow: hidden; background-color: var(--accent-bg); font-family: 'Inter', sans-serif; }

        /* --- NAVIGATION --- */
        .navbar { background: var(--sidebar-bg); height: 100vh; position: fixed; width: 260px; padding: 2rem 1.2rem; z-index: 1050; align-items: flex-start; }
        .nav-link { color: rgba(255,255,255,0.7) !important; padding: 12px 15px; border-radius: 12px; margin-bottom: 5px; display: flex; align-items: center; transition: 0.3s; }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }
        
        .top-header { margin-left: 260px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 0 2rem; display: flex; justify-content: flex-end; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; height: 60px; }
        main { margin-left: 260px; height: calc(100vh - 60px); padding: 2rem; overflow-y: auto; }

        /* --- INTERACTIVE PROFILE ELEMENTS --- */
        .profile-card { background: var(--white); border-radius: 20px; padding: 2rem; box-shadow: var(--shadow); border: none; transition: 0.3s; }
        .profile-img-container { position: relative; width: 130px; margin: 0 auto 1.5rem; }
        .profile-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); padding: 3px; background: white; }
        
        .upload-label { 
            position: absolute; bottom: 5px; right: 5px; 
            background: var(--primary); color: white; 
            width: 35px; height: 35px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border: 2px solid white; transition: 0.2s;
        }
        .upload-label:hover { transform: scale(1.1); background: #00569d; }
        #pfp-input { display: none; }

        .editable-field { transition: 0.3s; border: 2px solid transparent; }
        .editing .editable-field { background: #f1f7ff !important; border-color: var(--primary) !important; }
        
        .stat-box { background: #f8faff; border-radius: 15px; padding: 1rem; text-align: center; }

        @media (max-width: 991px) {
            html, body { overflow: auto; }
            .navbar { width: 100%; height: auto; position: fixed; top: 0; padding: 0.7rem 1rem; flex-direction: row !important; }
            .top-header { margin-left: 0; margin-top: 55px; }
            main { margin-left: 0; height: auto; padding: 1rem; }
            .desktop-only { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark flex-lg-column">
        <div class="container-fluid flex-lg-column">
            <div class="d-flex justify-content-between w-100 align-items-center">
                <a class="navbar-brand fw-bold" href="homepage.html">
                    <i class="fas fa-chalkboard-teacher me-2"></i> 
                    <span class="desktop-only">Teacher Portal</span>
                </a>
            </div>
            <div class="collapse navbar-collapse w-100" id="sidebarMenu">
                <ul class="navbar-nav flex-column w-100 mt-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-chart-line me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="student.html"><i class="fas fa-users me-2"></i> My Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="curriculum.html"><i class="fas fa-book-open me-2"></i> Curriculum</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check me-2"></i> Attendance</a></li>
                    <li class="nav-item mt-lg-5"><a class="nav-link text-danger" href="javascript:void(0)" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> Log out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-header">
        <div class="d-flex align-items-center gap-2">
            <div class="text-end d-none d-sm-block">
                <p class="fw-bold mb-0 text-dark" style="font-size: 0.8rem;" id="header-name-text">User Name</p>
                <small class="text-muted" style="font-size: 0.65rem;" id="header-id-text">ID: ---</small>
            </div>
            <img id="header-avatar" src="" class="rounded-circle border border-primary p-1" width="32" height="32" alt="User Profile">
        </div>
    </header>

    <main>
        <div id="profile-container" class="row g-4">
            <div class="col-lg-4">
                <div class="profile-card text-center">
                    <div class="profile-img-container">
                        <img id="display-pfp" src="" class="profile-img" alt="Teacher">
                        <label for="pfp-input" class="upload-label">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="pfp-input" accept="image/*">
                    </div>
                    
                    <h4 id="display-name" class="fw-bold mb-1">User Name</h4>
                    <p id="display-title" class="text-muted small">Faculty Member</p>
                    
                    <div class="row g-2 my-4">
                        <div class="col-6"><div class="stat-box"><h5 class="fw-bold mb-0">0</h5><small>Students</small></div></div>
                        <div class="col-6"><div class="stat-box"><h5 class="fw-bold mb-0">0</h5><small>Sections</small></div></div>
                    </div>

                    <button id="edit-btn" class="btn btn-primary w-100 rounded-3 fw-bold py-2" onclick="toggleEdit()">
                        <i class="fas fa-edit me-2"></i>Edit Profile
                    </button>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="profile-card" id="info-card">
                    <h5 class="fw-bold mb-4" style="color: var(--primary);">Personal Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Full Name</label>
                            <input type="text" id="input-name" class="form-control editable-field bg-light border-0" value="" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Portal ID</label>
                            <input type="text" id="input-id" class="form-control bg-light border-0" value="" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Classification</label>
                            <input type="text" id="input-class" class="form-control bg-light border-0" value="" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="small fw-bold text-muted mb-1">Email Address</label>
                            <input type="email" id="input-email" class="form-control editable-field bg-light border-0" value="not-set@school.edu" disabled>
                        </div>
                        <div class="col-12">
                            <label class="small fw-bold text-muted mb-1">Professional Bio</label>
                            <textarea id="input-bio" class="form-control editable-field bg-light border-0" rows="4" disabled>No bio provided yet.</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 1. LOAD DATA FROM LOCALSTORAGE ---
        function loadUserProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));

            if (!user) {
                window.location.href = '../Login Page/login.html';
                return;
            }

            // Update Header & Info
            document.getElementById('header-name-text').innerText = user.name;
            document.getElementById('header-id-text').innerText = "ID: " + user.portalId;
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('input-name').value = user.name;
            document.getElementById('input-id').value = user.portalId;
            document.getElementById('input-class').value = user.classification.toUpperCase();

            // Handle Profile Picture Persistence
            if (user.profilePic) {
                // If the user has a saved Base64 photo, use it
                document.getElementById('header-avatar').src = user.profilePic;
                document.getElementById('display-pfp').src = user.profilePic;
            } else {
                // Fallback to generated initials if no photo exists
                const initials = user.name.split(' ').map(n => n[0]).join('+');
                const avatarUrl = `https://ui-avatars.com/api/?name=${initials}&background=0067ba&color=fff`;
                document.getElementById('header-avatar').src = avatarUrl;
                document.getElementById('display-pfp').src = avatarUrl;
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', loadUserProfile);

        // --- 2. LOGOUT LOGIC ---
        function handleLogout() {
            if(confirm("Confirm Log out?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../index.html';
            }
        }

        // --- 3. PERMANENT PFP UPLOAD LOGIC ---
        // Using Base64 conversion to save image in localStorage
        
        document.getElementById('pfp-input').onchange = function(evt) {
            const file = evt.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;

                    // Update UI
                    document.getElementById('display-pfp').src = base64Image;
                    document.getElementById('header-avatar').src = base64Image;

                    // Save to Current Session
                    let user = JSON.parse(localStorage.getItem('currentUser'));
                    user.profilePic = base64Image;
                    localStorage.setItem('currentUser', JSON.stringify(user));

                    // Save to Master User List
                    updateMasterUserList(user);
                };
                reader.readAsDataURL(file);
            }
        };

        function updateMasterUserList(updatedUser) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            const index = users.findIndex(u => u.portalId === updatedUser.portalId);
            if (index !== -1) {
                users[index] = updatedUser;
                localStorage.setItem('users', JSON.stringify(users));
            }
        }

        // --- 4. EDIT MODE LOGIC ---
        let isEditing = false;
        function toggleEdit() {
            isEditing = !isEditing;
            const container = document.getElementById('info-card');
            const btn = document.getElementById('edit-btn');
            const inputs = document.querySelectorAll('.editable-field');

            if (isEditing) {
                container.classList.add('editing');
                btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Changes';
                btn.classList.replace('btn-primary', 'btn-success');
                inputs.forEach(input => input.disabled = false);
            } else {
                container.classList.remove('editing');
                btn.innerHTML = '<i class="fas fa-edit me-2"></i>Edit Profile';
                btn.classList.replace('btn-success', 'btn-primary');
                inputs.forEach(input => input.disabled = true);

                const newName = document.getElementById('input-name').value;
                
                let user = JSON.parse(localStorage.getItem('currentUser'));
                user.name = newName;
                localStorage.setItem('currentUser', JSON.stringify(user));
                updateMasterUserList(user);
                
                loadUserProfile();
                alert("Profile changes saved permanently!");
            }
        }
    </script>
</body>
</html>
